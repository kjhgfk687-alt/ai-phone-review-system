# RAG 检索评测集——开发者维护
# 规则：query 为用户可能输入的问题；expect 为理想命中语料应包含的关键词（命中任一即算通过）。
# 运行方式：开发者模式 → RAG 知识库 → 「🎯 命中率评测」
