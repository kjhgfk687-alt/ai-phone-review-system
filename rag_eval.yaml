    expect: ["小米15"]
  - q: "小米15 充电功率"
    expect: ["小米15"]
  - q: "天玑9500 性能评分"
    expect: ["天玑9500"]
  - q: "iPhone 17 Pro Max 相机"
    expect: ["iPhone 17 Pro Max"]
  - q: "Redmi K80 参数"
    expect: ["K80"]
  - q: "vivo X300 Ultra 影像"
    expect: ["X300 Ultra"]
  - q: "一加 15 屏幕"
    expect: ["一加15"]
  - q: "真我 GT8 Pro 规格"
    expect: ["GT8 Pro"]
  - q: "三星 Galaxy S26 规格"
    expect: ["Galaxy S26"]
  - q: "荣耀 Magic8 发布"
    expect: ["Magic8"]
  - q: "华为 Pura 80 影像"
    expect: ["Pura 80"]
  - q: "2026 旗舰机续航趋势"
    expect: ["续航"]
  - q: "OPPO Find X9s Pro 快充"
    expect: ["X9s Pro"]
  - q: "iQOO Neo10 性能"
    expect: ["Neo10"]
